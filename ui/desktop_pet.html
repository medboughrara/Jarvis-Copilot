<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Desktop Pet</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            background-color: rgba(0, 0, 0, 0) !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
        }
        .drag-handle {
            -webkit-app-region: drag;
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .no-drag {
            -webkit-app-region: no-drag;
        }
        
        /* Floating & Glow Animations */
        @keyframes floatPet {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: floatPet 3.5s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 242, 255, 0.45)); }
            50% { filter: drop-shadow(0 0 24px rgba(0, 242, 255, 0.85)); }
        }
        .glow-mascot {
            animation: pulseGlow 2.5s infinite;
        }

        /* Screen Grounding Shutter Flash */
        @keyframes shutterFlash {
            0% { opacity: 0; transform: scale(0.9); }
            30% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0; transform: scale(1); }
        }
        .shutter-active {
            animation: shutterFlash 1.2s ease-out forwards;
        }

        /* Arm Pointing Keyframes */
        @keyframes armPointLeft {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-45deg); }
        }
        @keyframes armPointRight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(45deg); }
        }
        .arm-pointing-left {
            transform-origin: 40px 140px;
            animation: armPointLeft 0.4s ease-out forwards;
        }
        .arm-pointing-right {
            transform-origin: 160px 140px;
            animation: armPointRight 0.4s ease-out forwards;
        }

        /* Speech Bubble Styling */
        .speech-bubble {
            max-width: 220px;
            margin-bottom: 6px;
            padding: 8px 12px;
            border-radius: 16px;
            background: rgba(4, 8, 18, 0.88);
            border: 1px solid rgba(0, 242, 255, 0.5);
            color: #cffafe;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }
        .hidden {
            display: none !important;
        }

        /* Shutter Indicator Badge */
        .shutter-badge {
            position: absolute;
            top: 4px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(8, 20, 36, 0.92);
            border: 1px solid #00f2ff;
            color: #00f2ff;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            box-shadow: 0 4px 16px rgba(0, 242, 255, 0.4);
            backdrop-filter: blur(10px);
        }

        /* Quick Mic Button */
        .quick-mic-btn {
            position: absolute;
            bottom: 4px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 242, 255, 0.15);
            border: 1px solid #00f2ff;
            color: #00f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
            transition: all 0.2s;
        }
        .quick-mic-btn:hover {
            background: #00f2ff;
            color: #040812;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- 1. Visible Screen Grounding Active Indicator Banner -->
    <div id="shutter-indicator-badge" class="shutter-badge hidden">
        <span class="material-symbols-outlined" style="font-size: 14px; color: #f59e0b;">camera</span>
        <span>📸 Screen Grounding Active</span>
    </div>

    <!-- 2. Floating Speech / Thought Bubble -->
    <div id="pet-speech-bubble" class="speech-bubble hidden">
        <div id="pet-speech-text" style="line-height: 1.4;">Jarvis ready!</div>
    </div>

    <!-- 3. Mascot Stage Container (Draggable) -->
    <div id="pet-mascot-container" class="drag-handle animate-float glow-mascot" style="position: relative; width: 190px; height: 190px; display: flex; align-items: center; justify-content: center;">
        
        <!-- Ambient Orbit Ring -->
        <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(0, 242, 255, 0.2); pointer-events: none;"></div>

        <!-- Robot Mascot SVG with Pointing Arms & Visemes -->
        <svg id="pet-mascot-svg" class="no-drag" style="width: 160px; height: 160px; cursor: pointer;" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="petGradBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0e1726" />
                    <stop offset="100%" stop-color="#020617" />
                </linearGradient>
                <linearGradient id="petGradAccent" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop id="pet-grad-stop1" offset="0%" stop-color="#00f2ff" />
                    <stop id="pet-grad-stop2" offset="100%" stop-color="#3b82f6" />
                </linearGradient>
                <filter id="petGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3.5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Antenna & Glow Beacon -->
            <path d="M 100 50 L 100 28" stroke="#00f2ff" stroke-width="3" stroke-linecap="round" />
            <circle id="pet-antenna-light" cx="100" cy="24" r="5" fill="#00f2ff" filter="url(#petGlow)" />

            <!-- Left Robotic Arm (Animatable for Pointing) -->
            <g id="pet-arm-left">
                <path d="M 46 115 Q 26 135 34 150" stroke="#00f2ff" stroke-width="6" stroke-linecap="round" fill="none" />
                <circle cx="34" cy="150" r="5" fill="#38bdf8" />
            </g>

            <!-- Right Robotic Arm (Animatable for Pointing) -->
            <g id="pet-arm-right">
                <path d="M 154 115 Q 174 135 166 150" stroke="#00f2ff" stroke-width="6" stroke-linecap="round" fill="none" />
                <circle cx="166" cy="150" r="5" fill="#38bdf8" />
            </g>

            <!-- Head / Chassis Body -->
            <rect x="46" y="50" width="108" height="96" rx="28" fill="url(#petGradBody)" stroke="#00f2ff" stroke-width="2.5" />
            
            <!-- Visor Display Screen -->
            <rect x="56" y="62" width="88" height="60" rx="18" fill="#030712" stroke="#00f2ff" stroke-opacity="0.4" stroke-width="1.5" />

            <!-- Left Eye Socket & Pupil -->
            <ellipse id="pet-eye-left" cx="80" cy="88" rx="12" ry="16" fill="#00f2ff" filter="url(#petGlow)" />
            <circle id="pet-pupil-left" cx="80" cy="88" r="4" fill="#ffffff" />

            <!-- Right Eye Socket & Pupil -->
            <ellipse id="pet-eye-right" cx="120" cy="88" rx="12" ry="16" fill="#00f2ff" filter="url(#petGlow)" />
            <circle id="pet-pupil-right" cx="120" cy="88" r="4" fill="#ffffff" />

            <!-- Viseme Animated Mouth Path -->
            <path id="pet-mouth" d="M 88 110 Q 100 114 112 110" stroke="#00f2ff" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#petGlow)" />
        </svg>

        <!-- Floating Quick Mic Button -->
        <button id="btn-pet-mic" class="quick-mic-btn no-drag" title="Talk with Jarvis">
            <span class="material-symbols-outlined" style="font-size: 16px;">mic</span>
        </button>
    </div>

    <script src="desktop_pet.js"></script>
</body>
</html>
